name: CI

# macOS minutes are expensive: run on main and PRs only (not on tags; the release workflow
# builds those), skip changes that cannot affect the build, and cancel superseded runs.
on:
  push:
    branches: [main]
    paths-ignore: ["site/**", "**/*.md", "LICENSE"]
  pull_request:
    paths-ignore: ["site/**", "**/*.md", "LICENSE"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: scripts/check.sh
