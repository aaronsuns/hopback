[workspace]
resolver = "2"
members = ["crates/hook"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Aaron Sun <aaronsuns@gmail.com>"]
repository = "https://github.com/aaronsuns/hopback"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
